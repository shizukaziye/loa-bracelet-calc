<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to Loseii</title>
<link rel="canonical" href="https://www.loseii.com/loa-bracelet-calc/">
<meta name="robots" content="noindex">
<!--
  GitHub Pages serves this page for any path under the old repo that no longer
  has a file. It sends the visitor to the same path on the new address: the
  remainder after /loa-bracelet-calc/, plus the query string and the hash.

  Framed, it does not redirect and answers the handoff instead — which also
  covers the case where a browser asks for handoff.html before the stub has
  landed and Pages serves this page in its place.
-->
<noscript><meta http-equiv="refresh" content="0; url=https://www.loseii.com/loa-bracelet-calc/"></noscript>
<script>
"use strict";
(function () {
  if (window.top === window) return;   // top-level load: the redirect below handles it

  var ALLOW = [
    "https://www.loseii.com",
    "https://loseii.com",
    "https://shizukaziye.github.io",
    "http://localhost:8080",
    "http://localhost:8081",
    "http://127.0.0.1:8080"
  ];

  function allowed(origin) {
    for (var i = 0; i < ALLOW.length; i++) if (ALLOW[i] === origin) return true;
    return false;
  }

  function dump() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k === null || k === "__proto__") continue;
        var v = null;
        try { v = localStorage.getItem(k); } catch (e) { continue; }
        if (typeof v === "string") out[k] = v;
      }
    } catch (e) {}
    return out;
  }

  window.addEventListener("message", function (ev) {
    if (!allowed(ev.origin)) return;
    var m = ev.data;
    if (!m || typeof m !== "object" || m.type !== "bc-handoff-request") return;
    if (!ev.source) return;
    try { ev.source.postMessage({ type: "bc-handoff", data: dump() }, ev.origin); } catch (e) {}
  }, false);
})();
</script>
<style>body{background:#0c0e12;color:#e7e9ee;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}a{color:#e8b75c}</style>
</head>
<body>
<div>
<p>This tool now lives at <a id="go" href="https://www.loseii.com/loa-bracelet-calc/">www.loseii.com/loa-bracelet-calc/</a></p>
<p id="wait">Redirecting&hellip;</p>
</div>
<script>
"use strict";
(function () {
  var BASE = "https://www.loseii.com/loa-bracelet-calc/";
  var MARK = "/loa-bracelet-calc/";
  var path = location.pathname || "";
  var i = path.indexOf(MARK);
  var rest = (i === -1) ? "" : path.slice(i + MARK.length);
  while (rest.charAt(0) === "/") rest = rest.slice(1);      // never double the slash
  var target = BASE + rest + location.search + location.hash;

  var link = document.getElementById("go");
  if (link) link.href = target;
  if (window.top !== window) {
    var wait = document.getElementById("wait");
    if (wait && wait.parentNode) wait.parentNode.removeChild(wait);
    return;                 // framed: the handoff handler above is the whole job
  }
  location.replace(target);
})();
</script>
</body>
</html>
